name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest -q
      - run: uv build

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject private IPv4 addresses and e-mail addresses in tracked files
        run: |
          set -u
          failed=0
          ipv4='(^|[^0-9.])(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)'
          if git ls-files -z | xargs -0 grep -nIE "$ipv4"; then
            echo "::error::Private IPv4 address found in tracked files"
            failed=1
          fi
          email='[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'
          allowed='@example\.(com|org)$'
          found=$(git ls-files -z | xargs -0 grep -noIE "$email" | grep -viE "$allowed" || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::E-mail address outside example.com/example.org found in tracked files"
            failed=1
          fi
          exit "$failed"
