name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv build

  public-safety:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject private IPv4 addresses and e-mail addresses in tracked files
        run: |
          set -u
          failed=0
          ipv4='(^|[^0-9.])(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)'
          if git ls-files -z | xargs -0 grep -nIE "$ipv4"; then
            echo "::error::Private IPv4 address found in tracked files"
            failed=1
          fi
          email='[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'
          allowed='@example\.(com|org)$'
          found=$(git ls-files -z | xargs -0 grep -noIE "$email" | grep -viE "$allowed" || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::E-mail address outside example.com/example.org found in tracked files"
            failed=1
          fi
          exit "$failed"
